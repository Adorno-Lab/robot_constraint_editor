name: CPP Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testbranches: ['release','master']

    steps:
      - uses: actions/checkout@v2

      - name: Apt update
        run: sudo apt update

      - name: Install dependencies
        run: | 
          sudo apt-get update && sudo apt-get install -y cmake g++ libeigen3-dev fakeroot 
           
      - name: Install Yaml-Cpp
        run: | 
          git clone https://github.com/jbeder/yaml-cpp
          cd yaml-cpp
          mkdir build
          cd build
          cmake -DYAML_BUILD_SHARED_LIBS=on ..
          make
          sudo make install
      
      - name: Install DQ Robotics
        run: |
          git clone https://github.com/dqrobotics/cpp
          cd cpp
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # Inline commands (instead of scripts run with sh) so that any failure stops the job
      - name: Build this project
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)

      - name: Install this project
        run: |
          cd build
          sudo make install
          sudo ldconfig

      - name: Build tests
        run: |
             cd examples/tests
             mkdir -p build && cd build
             cmake ..
             make

      - name: Build and run tests_v3
        run: |
             cd examples/tests_v3
             mkdir -p build && cd build
             cmake ..
             make
             ./tests_v3
